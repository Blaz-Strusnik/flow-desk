# Production stack for a single VPS: Postgres + the API + the web app,
# each built from the repo's own Dockerfiles. See README.md for the full
# deployment walkthrough (reverse proxy / TLS, migrations, updates).
#
# Usage:
#   cp .env.production.example .env   # then fill in real secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml run --rm migrate

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-flowdesk}
    volumes:
      - flowdesk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowdesk} -d ${POSTGRES_DB:-flowdesk}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No host port published: only the api service (on the same Docker
    # network) needs to reach Postgres.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-flowdesk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-flowdesk}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env}
      UPLOADS_DRIVER: local
      UPLOADS_LOCAL_DIR: ./uploads
    volumes:
      - flowdesk_uploads:/app/uploads
    ports:
      # Bind to localhost only — put a reverse proxy (Caddy/Nginx) in front
      # for TLS instead of exposing this directly to the internet.
      - "127.0.0.1:3001:3001"

  # One-off migration runner, not a long-running service: `docker compose
  # run --rm migrate` after the first `up` and after every deploy that adds
  # a migration. Reuses the api image's `build` stage (which still has the
  # full pnpm/prisma toolchain, unlike the slim `runtime` stage the api
  # service actually runs) so `prisma migrate deploy` has something to run.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-flowdesk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-flowdesk}?schema=public
    working_dir: /repo/apps/api
    # Invoke the prisma binary directly rather than via `pnpm exec` —
    # pnpm's pre-exec dependency-drift check runs a `pnpm install` under the
    # hood, which re-prunes this workspace down to prod-only and removes
    # prisma itself (a devDependency) before it ever gets to run.
    entrypoint: ["node_modules/.bin/prisma"]
    command: ["migrate", "deploy"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked in at build time — see README for why this can't be
        # changed at container-start via `environment:` alone.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?set NEXT_PUBLIC_WS_URL in .env}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  # Pinned names (Compose otherwise prefixes them with the project name,
  # e.g. the directory name) so backup/restore commands are predictable
  # regardless of where the repo is cloned or which -p is used.
  flowdesk_postgres_data:
    name: flowdesk_postgres_data
  flowdesk_uploads:
    name: flowdesk_uploads
